[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-intake"
version = "0.1.0"
description = "AI invoice intake for accounts payable: OCR + LLM extraction, validation, review queue"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Auth
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    # Documents, images, OCR
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "pillow>=10.2",
    "numpy>=1.26",
    # LLM
    "google-genai>=1.0",
    "anthropic>=0.40",
    # Matching + parsing
    "rapidfuzz>=3.6",
    "python-dateutil>=2.9",
    # Storage (prod)
    "boto3>=1.34",
    # UI
    "streamlit>=1.33",
    "requests>=2.31",
    "pandas>=2.2",
    # Synthetic data
    "faker>=24.0",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.3",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
